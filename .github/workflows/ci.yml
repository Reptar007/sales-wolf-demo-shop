name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The isolation guard runs first and on its own. If WolfMart has grown a link
  # to SalesWolf, that is the finding — not a lint error buried under it.
  isolation:
    name: isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - run: npm ci --prefix backend
      - run: npm test --prefix backend

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
