name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The isolation guard runs first and on its own. If WolfMart has grown a link
  # to SalesWolf, that is the finding — not a lint error buried under it.
  isolation:
    name: isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
